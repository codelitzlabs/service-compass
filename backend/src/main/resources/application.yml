spring:
  application:
    name: service-compass
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/service_compass}
    username: ${DB_USERNAME:service_compass}
    password: ${DB_PASSWORD:local-development-only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    default-property-inclusion: non_null
portal:
  company-name: Codelitz Labs
server:
  error:
    include-message: never
springdoc:
  api-docs:
    path: /api/openapi
  swagger-ui:
    path: /api/docs
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:context;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE DOMAIN IF NOT EXISTS TIMESTAMPTZ AS TIMESTAMP WITH TIME ZONE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    locations: classpath:db/h2-migration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
